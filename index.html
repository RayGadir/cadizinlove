<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Libreto y audios del coro Cádiz in Love: letras y pistas de ensayo por canción." />
<meta name="theme-color" content="#161826" />
<title>Cádiz in Love</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23161826'/%3E%3Cpath d='M50 80 C18 55 8 33 25 20 C36 12 48 17 50 30 C52 17 64 12 75 20 C92 33 82 55 50 80 Z' fill='%239184d9'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">
      <div class="header-kicker">Coro · Cádiz 2026</div>
      <div class="header-name" id="group-name">Cádiz in Love</div>
    </div>
    <div class="avatar" id="admin-avatar" title="Cargando...">…</div>
  </header>

  <nav class="nav-menu hidden" id="tabs">
    <button class="nav-menu-item active" data-tab="inicio">Inicio</button>
    <button class="nav-menu-item" data-tab="libreto">Libreto</button>
    <button class="nav-menu-item" data-tab="audios">Audios</button>
  </nav>

  <div class="search-row hidden" id="search-row">
    <input type="search" id="search-input" class="search-input" placeholder="Buscar canción..." />
  </div>

  <main id="main">
    <section id="inicio-view" class="tab-view">
      <div class="hero">
        <div class="hero-kicker"><span></span><em>El tablón</em></div>
        <h1 id="inicio-greeting">Bienvenido</h1>
        <p id="inicio-subtitle">Aquí verás los avisos del director y las novedades del repertorio.</p>
      </div>
      <div id="avisos-list" class="avisos-list"></div>
      <div class="repertoire-summary">
        <h2>El repertorio</h2>
        <span id="repertoire-count"></span>
      </div>
      <div id="repertoire-list" class="repertoire-list"></div>
    </section>

    <section id="libreto-view" class="tab-view hidden"></section>

    <section id="audios-view" class="tab-view hidden">
      <div class="audios-toolbar">
        <button id="rehearsal-toggle" class="btn btn-primary">Modo ensayo</button>
      </div>
      <div id="audios-list"></div>
    </section>

    <section id="song-detail" class="song-detail hidden">
      <button id="back-btn" class="btn btn-ghost">&larr; Volver</button>
      <span id="detail-kind" class="badge"></span>
      <h2 id="detail-title"></h2>
      <pre id="detail-letter" class="letter"></pre>
    </section>
  </main>

  <div id="bottom-bars">
    <div id="rehearsal-bar" class="rehearsal-bar hidden">
      <div class="rehearsal-info">
        <strong id="rehearsal-current-title">—</strong>
        <span id="rehearsal-position"></span>
      </div>
      <label class="audio-type-select">
        Voz:
        <select id="audio-type"></select>
      </label>
      <label class="shuffle-toggle">
        <input type="checkbox" id="shuffle-cuples" />
        Barajar cuplés
      </label>
      <button id="rehearsal-close" class="btn btn-ghost">Cerrar</button>
    </div>

    <div id="player-bar" class="player-bar hidden">
      <button id="player-prev" class="btn btn-icon" title="Anterior">⏮</button>
      <button id="player-playpause" class="btn btn-icon" title="Reproducir/Pausar">▶</button>
      <button id="player-next" class="btn btn-icon" title="Siguiente">⏭</button>
      <button id="player-loop" class="btn btn-icon" title="Repetir canción">🔁</button>
      <div class="player-track">
        <div id="player-title">—</div>
        <input type="range" id="player-seek" value="0" min="0" max="1000" step="1" />
      </div>
    </div>
  </div>

  <audio id="audio-el" preload="none"></audio>

  <script src="js/app.js"></script>
</body>
</html>
